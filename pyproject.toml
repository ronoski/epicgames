[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-workflow"
version = "0.1.0"
description = "Autonomous, scope-aware reconnaissance workflow for authorized bug-bounty engagements"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dns = ["dnspython>=2.3"]
dev = ["pytest>=7.0"]

[project.scripts]
recon = "recon.cli:main"

[tool.setuptools.packages.find]
include = ["recon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
